name: Deploy TrabajoYa Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -o TrabajoYa_V2_MEJORADA.zip -d proyecto
          PROJECT_DIR="$(dirname "$(find proyecto -name package.json -type f -print -quit)")"
          test -f "$PROJECT_DIR/package.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Construir web
        run: |
          cd "$PROJECT_DIR"
          npm run build -- --base=/TrabajoYa/
          test -d dist
          echo "DIST_DIR=$PROJECT_DIR/dist" >> "$GITHUB_ENV"

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
        
