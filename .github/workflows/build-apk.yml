name: Build TrabajoYa APK V2

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extraer proyecto V2
        run: |
          mkdir -p proyecto
          unzip -o "TrabajoYa_V2_MEJORADA.zip" -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Encontrar proyecto Node
        run: |
          PROJECT_DIR=$(find proyecto -name package.json -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          
      
      
      - name: Aplicar corrección de postulaciones
        run: |
          cp "$GITHUB_WORKSPACE/main.js" "$GITHUB_WORKSPACE/$PROJECT_DIR/src/main.js"
          echo "Corrección de postulaciones aplicada"
          
          
          

      - name: Instalar dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Instalar Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Construir aplicación web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      - name: Preparar Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          
      
      
      - name: Compilar paquete AAB firmado
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trabajoya-release.jks
        run: |
          set -euo pipefail

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          if not p.exists():
              p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("No se encontró el archivo Gradle de la aplicación.")

          s = p.read_text()
          is_kotlin = p.suffix == ".kts"

          if is_kotlin:
              signing = """
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              release_line = 'signingConfig = signingConfigs.getByName("release")'
          else:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              release_line = "signingConfig signingConfigs.release"

          if "signingConfigs" not in s:
              s = re.sub(r'(?m)^android\\s*\\{',
                         lambda m: m.group(0) + "\\n" + signing,
                         s, count=1)

          if "signingConfigs" not in s:
              raise SystemExit("No se pudo insertar signingConfigs.")

          if "buildTypes" in s:
              if is_kotlin:
                  pattern = r'(?m)^(\\s*)getByName\\("release"\\)\\s*\\{'
                  replacement = lambda m: m.group(0) + "\\n" + m.group(1) + "    " + release_line
                  s, n = re.subn(pattern, replacement, s, count=1)
              else:
                  pattern = r'(?m)^\\s*release\\s*\\{'
                  s, n = re.subn(pattern, lambda m: m.group(0) + "\\n            " + release_line, s, count=1)
              if n == 0:
                  raise SystemExit("No se encontró el bloque release para configurar la firma.")
          else:
              raise SystemExit("El archivo no tiene buildTypes; necesito revisar su estructura.")

          p.write_text(s)
          print("Configuración de firma aplicada.")
          PY

          chmod +x gradlew
          ./gradlew bundleRelease
          
          

      - name: Guardar paquete AAB
        uses: actions/upload-artifact@v4
        with:
          name: TrabajoYa-AAB
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/*.aab
          

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrabajoYa-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
