name: Build TrabajoYa APK V2

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extraer proyecto V2
        run: |
          mkdir -p proyecto
          unzip -o "TrabajoYa_V2_MEJORADA.zip" -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Encontrar proyecto Node
        run: |
          PROJECT_DIR=$(find proyecto -name package.json -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          
      
      
      - name: Aplicar corrección de postulaciones
        run: |
          cp "$GITHUB_WORKSPACE/main.js" "$GITHUB_WORKSPACE/$PROJECT_DIR/src/main.js"
          echo "Corrección de postulaciones aplicada"
          
          
          

      - name: Instalar dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Instalar Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Construir aplicación web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      - name: Preparar Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar Android 16
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' variables.gradle
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/' variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' variables.gradle

      - name: Revisar versiones de Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          echo "=== ARCHIVO PRINCIPAL ==="
          cat variables.gradle || true
          echo "=== CONFIGURACION APP ==="
          cat app/build.gradle
                    echo "=== VERSION ANDROID GRADLE PLUGIN ==="
          grep -R "com.android.tools.build:gradle" -n . || true
                    echo "=== VERSION DE GRADLE ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          
      
      
      
      
      - name: Compilar y firmar paquete AAB
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/trabajoya-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          chmod +x gradlew
          ./gradlew bundleRelease

          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"

          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify "$AAB"
          
          
          
          

      - name: Guardar paquete AAB
        uses: actions/upload-artifact@v4
        with:
          name: TrabajoYa-AAB
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/*.aab
          

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrabajoYa-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
